  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Màn hình tải trang siêu nhanh (0.01s hiển thị ngay, không bị màn hình trắng) */
    #page-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #page-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, #EE4D2D, #FF6842);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 32px;
      box-shadow: 0 10px 25px rgba(238, 77, 45, 0.3);
      animation: pulse 1.6s infinite ease-in-out;
    }
    .loader-title {
      margin-top: 18px;
      font-size: 16px;
      font-weight: 700;
      color: #0F172A;
    }
    .loader-sub {
      margin-top: 6px;
      font-size: 13px;
      color: #64748B;
    }
    .loader-bar-wrap {
      width: 160px;
      height: 4px;
      background: #E2E8F0;
      border-radius: 10px;
      margin-top: 20px;
      overflow: hidden;
      position: relative;
    }
    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: #EE4D2D;
      border-radius: 10px;
      animation: loading 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes loading {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }

    /* Khung iframe chứa ứng dụng Google Apps Script */
    .app-frame-wrap {
      position: fixed;
      top: -46px; /* Ẩn thanh cảnh báo trên cùng của Google */
      left: 0;
      width: 100%;
      height: calc(100% + 46px);
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #F8FAFC;
    }
  </style>
</head>
<body>
  <!-- Màn hình chờ Shopee siêu mượt hiển thị ngay 0.01 giây -->
  <div id="page-loader">
    <div class="loader-icon">🛍️</div>
    <div class="loader-title">Hệ Thống Đặt Đơn Hộ Shopee</div>
    <div class="loader-sub">Đang kết nối hệ thống tốc độ cao...</div>
    <div class="loader-bar-wrap">
      <div class="loader-bar"></div>
    </div>
  </div>

  <div class="app-frame-wrap">
    <iframe 
      id="main-app-frame"
      src="https://script.google.com/macros/s/AKfycbx5dYh2nejqU5YDwvDGxzmutTai0NPg7B55Bn9U2yOC7Q4RqHL9WH8tICrqI-3-RdIi/exec" 
      allow="clipboard-write; clipboard-read"
      loading="eager"
      onload="hidePageLoader()">
    </iframe>
  </div>

  <script>
    // Ẩn màn hình chờ mượt mà khi iframe đã sẵn sàng
    function hidePageLoader() {
      const loader = document.getElementById('page-loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => { loader.style.display = 'none'; }, 400);
      }
    }

    // Cơ chế an toàn: Tự ẩn sau 6 giây nếu mạng chậm
    setTimeout(hidePageLoader, 6000);
  </script>
</body>
</html>
